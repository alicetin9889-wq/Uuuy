<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İkra 💞</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(
180deg,
#0f0f0f,
#1a1a1a,
#ff0055
);
animation:bgmove 10s infinite alternate;
z-index:-3;
}

@keyframes bgmove{
0%{
filter:hue-rotate(0deg);
}
100%{
filter:hue-rotate(20deg);
}
}

.float{
position:absolute;
opacity:0.10;
font-size:22px;
white-space:nowrap;
animation:float 12s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) rotate(0deg);
opacity:0;
}
100%{
transform:translateY(-120vh) rotate(8deg);
opacity:1;
}
}

.card{
width:90%;
max-width:420px;
padding:28px;
border-radius:30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
box-shadow:0 0 35px rgba(255,255,255,0.12);
animation:fade 1s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

button{
padding:14px 24px;
border:none;
border-radius:25px;
font-size:17px;
font-weight:bold;
background:white;
color:#ff0055;
margin-top:20px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

img{
width:240px;
border-radius:24px;
margin-top:18px;
box-shadow:0 0 25px rgba(255,255,255,0.2);
animation:imganim 5s infinite alternate;
}

@keyframes imganim{
0%{
transform:rotate(-2deg) translateY(0px);
}
100%{
transform:rotate(2deg) translateY(-8px);
}
}

.title{
font-size:42px;
text-shadow:0 0 15px rgba(255,255,255,0.5);
}

.text{
margin-top:20px;
font-size:19px;
line-height:35px;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="float" style="left:5%;">
alim seni seviyorum 💞
</div>

<div class="float" style="left:25%;animation-delay:2s;">
ikos 💖
</div>

<div class="float" style="left:45%;animation-delay:4s;">
iyi ki doğdun 💞
</div>

<div class="float" style="left:70%;animation-delay:1s;">
Aliii 😭
</div>

<div class="float" style="left:85%;animation-delay:5s;">
💛💙 ikra 💛💙
</div>

<div class="card">

<div id="content">

<div class="title">
💌 Gizli Dosya
</div>

<div class="text">

İkra için hazırlanmış özel doğum günü dosyası açılıyor...

</div>

<button onclick="scene1()">
Başlat 💞
</button>

</div>

</div>

<script>

function scene1(){

document.getElementById("content").innerHTML = `

<div class="title">
💖 Mini Test
</div>

<div class="text">

Ali'nin en sevdiği şey hangisi? 😭

</div>

<button onclick="scene2()">

İkra'nın trip atması 💞

</button>

<br>

<button onclick="wrong()">

Senin çok konuşman

</button>

`;

}

function wrong(){

alert("Yanlış cevap 😭");

}

function scene2(){

document.getElementById("content").innerHTML = `

<div class="title">
🚗 Hot Wheels Kızı
</div>

<div class="text">

Hot Wheels konuşmalarımız,<br>
random mesajların,<br>
saçma kahkahaların 😭<br><br>

İstemeden günümün en güzel kısmı oldu.

</div>

<button onclick="scene3()">

Devam 💌

</button>

`;

}

function scene3(){

document.getElementById("content").innerHTML = `

<div class="title">
💞 Jack & Kate
</div>

<img src="jackkate.jpg">

<div class="text">

Bak onlar bile sizi onaylıyor 😭💖<br><br>

Birbirinizi uğraştırıyorsunuz ama yine de konuşmadan duramıyorsunuz gibi.

</div>

<button onclick="scene4()">

Devam 💕

</button>

`;

}

function scene4(){

document.getElementById("content").innerHTML = `

<div class="title">
💌 Küçük Bir İtiraf
</div>

<img src="jack.jpg">

<div class="text">

Belki bazen fazla kıskanıyorum 😭<br><br>

Şu mobil oyun olayını sevmememin sebebi bile biraz bu.<br><br>

Çünkü seni diğer insanlardan biraz daha farklı görüyorum 💞

</div>

<button onclick="scene5()">

Devam 💖

</button>

`;

}

function scene5(){

document.getElementById("content").innerHTML = `

<div class="title">
💛💙 Bir Şey Daha
</div>

<div class="text">

Fenerbahçeli olmanla 💛💙<br>
yeşil gözlerinle,<br>

Seninle kurduğum hayalleri kimseyle değişmem.

</div>

<button onclick="scene6()">

</button>

`;

}

function scene6(){

document.getElementById("content").innerHTML = `

<div class="title" style="color:#ff4d88;">

Seni Seviyorum 💞

</div>

<div class="text">

İyi ki doğdun İkra 💖<br><br>

Bazı insanlar normal biri gibi girer hayatına...<br><br>

Sonra fark etmeden gününün en güzel kısmı olurlar.

</div>

<div style="
margin-top:30px;
font-size:24px;
opacity:0.8;
">

— Ali

</div>

`;

}

</script>

</body>
</html>
